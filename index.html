<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dika</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        html, body {
            overflow-x: hidden;
            min-height: 100vh;
        }

        body {
            background-color: #0a0a0f;
            background-image: radial-gradient(circle at 30% 40%, rgba(147, 51, 234, 0.2) 0%, transparent 30%),
                              radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15) 0%, transparent 35%),
                              url('https://files.catbox.moe/9h7wpt.jpg');
            background-size: cover, cover, cover;
            background-position: center;
            background-blend-mode: overlay;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        .glass {
            background: rgba(10, 10, 20, 0.4);
            backdrop-filter: blur(18px) saturate(200%);
            -webkit-backdrop-filter: blur(18px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        .neon-glow {
            text-shadow: 0 0 10px #c026d3, 0 0 25px #a855f7;
            letter-spacing: -0.02em;
        }

        .profile-container {
            width: 7rem;
            height: 7rem;
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            filter: drop-shadow(0 20px 20px #a855f750);
        }
        .profile-container:hover {
            transform: scale(1.1) rotate(2deg);
        }
        .social-card {
            transition: all 0.2s ease-out;
            will-change: transform;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .social-card i.fa-arrow-right, .social-card i.fa-copy {
            transition: transform 0.2s ease, opacity 0.2s;
        }
        .social-card:hover i.fa-arrow-right {
            transform: translateX(6px) scale(1.1);
        }
        .social-card:hover i.fa-copy {
            transform: scale(1.15);
        }

        .social-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative">

    <div class="max-w-md w-full mx-auto py-8">

        <div class="text-center mb-10">
            <div class="mx-auto rounded-full overflow-hidden border-4 border-purple-500 shadow-2xl shadow-purple-600/50 profile-container">
                <img src="https://raw.githubusercontent.com/IkyyExecutive-v2/IkyySukaNgewe/main/uploads/1772997219908_82959_1772997218523_file_2209.jpg" alt="Dika profile" class="w-full h-full object-cover">
            </div>
            <h1 class="text-5xl font-bold mt-5 tracking-tighter neon-glow" style="font-family: 'Space Grotesk', sans-serif;">DIKA TECH</h1>
            <p class="text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-pink-300 mt-1 text-lg font-medium">script kiddie • execuidor</p>
        </div>

        <div class="space-y-4">
            <a href="https://www.tiktok.com/@dikasecx" target="_blank" class="social-card glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt data-tilt-max="8" data-tilt-speed="300" data-tilt-glare="false">
                <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center text-3xl shadow-lg">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold text-xl tracking-tight">TikTok</div>
                    <div class="text-zinc-400 text-sm">@dikasecx</div>
                </div>
                <i class="fa-solid fa-arrow-right text-purple-400 text-xl"></i>
            </a>

            <a href="https://www.instagram.com/obitoesquado" target="_blank" class="social-card glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt data-tilt-max="8" data-tilt-speed="300">
                <div class="w-12 h-12 bg-gradient-to-br from-[#feda77] via-[#d62976] to-[#4f5bd5] rounded-xl flex items-center justify-center text-3xl shadow-lg">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold text-xl tracking-tight">Instagram</div>
                    <div class="text-zinc-400 text-sm">@obitoesquado</div>
                </div>
                <i class="fa-solid fa-arrow-right text-purple-400 text-xl"></i>
            </a>

            <a href="https://t.me/onedikaa" target="_blank" class="social-card glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt data-tilt-max="8" data-tilt-speed="300">
                <div class="w-12 h-12 bg-[#1E96C8] rounded-xl flex items-center justify-center text-3xl shadow-lg">
                    <i class="fa-brands fa-telegram"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold text-xl tracking-tight">Telegram</div>
                    <div class="text-zinc-400 text-sm">@onedikaa</div>
                </div>
                <i class="fa-solid fa-arrow-right text-purple-400 text-xl"></i>
            </a>

            <div onclick="copyDiscord()" class="social-card glass rounded-2xl p-4 flex items-center gap-4 group cursor-pointer" data-tilt data-tilt-max="8" data-tilt-speed="300">
                <div class="w-12 h-12 bg-[#5865F2] rounded-xl flex items-center justify-center text-3xl shadow-lg">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold text-xl tracking-tight">Discord</div>
                    <div class="text-zinc-400 text-sm" id="discord-text">@dikaalonely</div>
                </div>
                <i class="fa-solid fa-copy text-purple-400 text-xl"></i>
            </div>

            <a href="https://github.com/obitoGlory" target="_blank" class="social-card glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt data-tilt-max="8" data-tilt-speed="300">
                <div class="w-12 h-12 bg-[#171515] rounded-xl flex items-center justify-center text-3xl shadow-lg">
                    <i class="fa-brands fa-github"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold text-xl tracking-tight">GitHub</div>
                    <div class="text-zinc-400 text-sm">obitoGlory</div>
                </div>
                <i class="fa-solid fa-arrow-right text-purple-400 text-xl"></i>
            </a>
        
            <a href="https://obitoGlory.github.io" target="_blank" class="social-card glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt data-tilt-max="8" data-tilt-speed="300">
                <div class="w-12 h-12 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center text-2xl shadow-lg">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold text-xl tracking-tight">Website</div>
                    <div class="text-zinc-400 text-sm truncate">obitoGlory.github.io</div>
                </div>
                <i class="fa-solid fa-arrow-right text-purple-400 text-xl"></i>
            </a>
        </div>
        <p class="text-center text-zinc-600 text-xs mt-12 font-mono">dikatech s!nce 2k22</p>
    </div>

    <script>
        VanillaTilt.init(document.querySelectorAll("[data-tilt]"), {
            max: 9,
            speed: 250,       
            perspective: 1200,
            glare: false,      
            scale: 1.02,
            easing: "cubic-bezier(.03,.98,.52,.99)",
        });

        function copyDiscord() {
            navigator.clipboard.writeText("dikaalonely").then(() => {
                const discordSpan = document.getElementById('discord-text');
                const originalText = discordSpan.innerText;
                discordSpan.innerText = "copied! ✓";
                discordSpan.classList.add('text-green-400', 'font-medium');
                setTimeout(() => {
                    discordSpan.innerText = "@dikaalonely";
                    discordSpan.classList.remove('text-green-400', 'font-medium');
                }, 1200);
            }).catch(() => {

                alert("press 📋 manually: dikaalonely");
            });
        }
    </script>
</body>
</html>

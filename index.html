<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dika • Digital Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap');
        
        body {
            background: #050505;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass:hover {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
        }

        .profile-img {
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .profile-img:hover {
            transform: scale(1.15) rotate(5deg);
        }

        /* Optimization for fast rendering */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-md w-full mx-auto">
        <div class="text-center mb-10">
            <div class="relative inline-block">
                <div class="w-28 h-28 mx-auto rounded-3xl overflow-hidden border-2 border-purple-500/50 p-1 shadow-[0_0_20px_rgba(168,85,247,0.3)]">
                    <img src="https://raw.githubusercontent.com/IkyyExecutive-v2/IkyySukaNgewe/main/uploads/1772997219908_82959_1772997218523_file_2209.jpg" 
                         alt="Dika" class="w-full h-full object-cover rounded-[1.2rem] profile-img">
                </div>
            </div>
            <h1 class="text-4xl font-bold mt-5 tracking-tight neon-text" style="font-family: 'Space Grotesk', sans-serif;">DIKA TECH</h1>
            <p class="text-zinc-400 text-sm mt-1 uppercase tracking-widest">Digital Architect • DKV Student</p>
        </div>

        <div class="space-y-4">
            
            <a href="https://obitoGlory.github.io" target="_blank" class="glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt>
                <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-2xl text-white">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold">Portfolio</div>
                    <div class="text-zinc-500 text-xs">obitoGlory.github.io</div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-zinc-600 group-hover:text-purple-400 transition-colors"></i>
            </a>

            <a href="https://github.com/obitoGlory" target="_blank" class="glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt>
                <div class="w-12 h-12 bg-[#24292e] rounded-xl flex items-center justify-center text-2xl">
                    <i class="fa-brands fa-github"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold">GitHub</div>
                    <div class="text-zinc-500 text-xs">@obitoGlory</div>
                </div>
                <i class="fa-solid fa-code text-zinc-600 group-hover:text-purple-400"></i>
            </a>

            <a href="https://t.me/onedikaa" target="_blank" class="glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt>
                <div class="w-12 h-12 bg-[#0088cc] rounded-xl flex items-center justify-center text-2xl">
                    <i class="fa-brands fa-telegram"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold">Telegram</div>
                    <div class="text-zinc-500 text-xs">@onedikaa</div>
                </div>
                <i class="fa-solid fa-paper-plane text-zinc-600 group-hover:text-purple-400"></i>
            </a>

            <a href="https://www.instagram.com/obitoesquado" target="_blank" class="glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt>
                <div class="w-12 h-12 bg-gradient-to-tr from-[#f56040] to-[#833ab4] rounded-xl flex items-center justify-center text-2xl">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold">Instagram</div>
                    <div class="text-zinc-500 text-xs">@obitoesquado</div>
                </div>
                <i class="fa-solid fa-camera text-zinc-600 group-hover:text-purple-400"></i>
            </a>

            <a href="https://www.tiktok.com/@dikasecx" target="_blank" class="glass rounded-2xl p-4 flex items-center gap-4 group" data-tilt>
                <div class="w-12 h-12 bg-black border border-white/20 rounded-xl flex items-center justify-center text-2xl">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold">TikTok</div>
                    <div class="text-zinc-500 text-xs">@dikasecx</div>
                </div>
                <i class="fa-solid fa-play text-zinc-600 group-hover:text-purple-400"></i>
            </a>

            <div onclick="copyDiscord()" class="glass rounded-2xl p-4 flex items-center gap-4 group cursor-pointer" data-tilt>
                <div class="w-12 h-12 bg-[#5865F2] rounded-xl flex items-center justify-center text-2xl">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="flex-1">
                    <div class="font-semibold">Discord</div>
                    <div id="discord-text" class="text-zinc-500 text-xs">@dikaalonely</div>
                </div>
                <i class="fa-solid fa-copy text-zinc-600 group-hover:text-purple-400"></i>
            </div>

        </div>

        <footer class="mt-12 text-center">
            <p class="text-[10px] text-zinc-600 uppercase tracking-[0.3em]">System Optimized by ObitoGlory</p>
        </footer>
    </div>

    <script>
        VanillaTilt.init(document.querySelectorAll("[data-tilt]"), {
            max: 8,
            speed: 1000,
            glare: true,
            "max-glare": 0.2,
            scale: 1.02
        });

        function copyDiscord() {
            navigator.clipboard.writeText("dikaalonely");
            const el = document.getElementById('discord-text');
            const original = el.innerText;
            el.innerText = "Copied to clipboard!";
            el.style.color = "#a855f7";
            setTimeout(() => {
                el.innerText = original;
                el.style.color = "";
            }, 1500);
        }
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dika</title>

    <!-- ── Dari Dika: Tailwind, FontAwesome, VanillaTilt ── -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

    <!-- ── Dari Canvas: Google Fonts extended + Space Grotesk dari Dika ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ════════════════════════════════════════════════════════════
           BASE — merged from both versions
        ════════════════════════════════════════════════════════════ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            /* Fallback color — canvas draws on top of this */
            background-color: #0a0a0f;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow-y: auto;       /* allow scroll on small screens */
            overflow-x: hidden;
        }

        /* ════════════════════════════════════════════════════════════
           CANVAS BACKGROUND — from Canvas version
           Sits at z-index:0; pointer-events:none so clicks pass through
        ════════════════════════════════════════════════════════════ */
        #mainCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            pointer-events: none;   /* HTML elements above receive events */
        }

        /* ════════════════════════════════════════════════════════════
           THEME PANEL — from Canvas version (top-right, non-intrusive)
        ════════════════════════════════════════════════════════════ */
        #themePanel {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top-color: rgba(255, 255, 255, 0.28);
            border-radius: 100px;
            padding: 8px 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .tBtn {
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.20);
            cursor: pointer;
            transition: transform .22s ease, border-color .22s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .tBtn:hover  { transform: scale(1.22); border-color: rgba(255,255,255,0.65); }
        .tBtn.active { border-color: rgba(255,255,255,0.95); transform: scale(1.15); }
        .tBtn span   { display: block; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; }

        /* ════════════════════════════════════════════════════════════
           AUDIO BUTTON — from Canvas version (bottom-right corner)
        ════════════════════════════════════════════════════════════ */
        #audioBtn {
            position: fixed;
            bottom: 20px;
            right: 16px;
            z-index: 20;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-top-color: rgba(255, 255, 255, 0.32);
            border-radius: 100px;
            color: rgba(255, 255, 255, 0.72);
            font-family: 'Inter', inherit;
            font-size: 11px; font-weight: 600; letter-spacing: .06em;
            cursor: pointer;
            transition: all .28s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }
        #audioBtn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.95);
            transform: scale(1.05);
        }
        #audioBtn.on {
            background: rgba(80, 200, 80, 0.12);
            border-color: rgba(100, 220, 100, 0.32);
            color: rgba(140, 255, 140, 0.9);
        }

        /* ════════════════════════════════════════════════════════════
           DIKA STYLES — from Dika (glass enhanced with Canvas sheen)
        ════════════════════════════════════════════════════════════ */
        .glass {
            background: rgba(10, 10, 20, 0.32);
            backdrop-filter: blur(24px) saturate(240%) brightness(1.10);
            -webkit-backdrop-filter: blur(24px) saturate(240%) brightness(1.10);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-top-color: rgba(255, 255, 255, 0.24);   /* meniscus top */
            box-shadow:
                0 25px 40px -12px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                inset 0 1px 0 rgba(255, 255, 255, 0.14),   /* top sheen */
                inset 0 -1px 0 rgba(100, 160, 255, 0.08);  /* bottom water tint */
        }

        .neon-glow {
            text-shadow: 0 0 10px #c026d3, 0 0 25px #a855f7;
            letter-spacing: -0.02em;
        }

        .profile-container {
            width: 7rem;
            height: 7rem;
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            filter: drop-shadow(0 20px 20px #a855f750);
        }
        .profile-container:hover { transform: scale(1.1) rotate(2deg); }

        .social-card {
            transition: all 0.2s ease-out;
            will-change: transform;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }
        .social-card i.fa-arrow-right,
        .social-card i.fa-copy {
            transition: transform 0.2s ease, opacity 0.2s;
        }
        .social-card:hover i.fa-arrow-right { transform: translateX(6px) scale(1.1); }
        .social-card:hover i.fa-copy        { transform: scale(1.15); }
        .social-card:active                 { transform: scale(0.98); }

        /* ── Page content sits above canvas ── */
        .page-content {
            position: relative;
            z-index: 5;
        }

        /* ── Canvas click ripple (injected by JS) ── */
        .cglass-ripple {
            position: fixed;
            border-radius: 50%;
            border: 1.5px solid rgba(200, 180, 255, 0.65);
            pointer-events: none;
            z-index: 15;
            transform: translate(-50%, -50%) scale(0);
            animation: cripple .85s cubic-bezier(0, 0, .2, 1) forwards;
        }
        @keyframes cripple {
            to { transform: translate(-50%, -50%) scale(6); opacity: 0; }
        }
    </style>
</head>

    <!-- ══════════════════════════════════════════════════════════
         CANVAS ANIMATED BACKGROUND JS — from Canvas version
         Only renders: gradient base + floating colorful orbs
         + click ripple/particle effects
         NO nav bar or hero text (Dika handles its own content)
    ══════════════════════════════════════════════════════════ -->
    <script>
    'use strict';

    /* ── THEMES (from Canvas version) ─────────────────────────────────── */
    const THEMES = [
        { // 0: Ocean
            bg:  ['#010810','#011220','#010A18'],
            orbs:['#0055FF','#00CCFF','#0033CC','#00FFEE','#0077FF','#0099CC'],
            accent:'#00C8FF'
        },
        { // 1: Sunset
            bg:  ['#100308','#160410','#0C0308'],
            orbs:['#FF4400','#FF0077','#CC00BB','#FF8800','#FF2244','#FF6600'],
            accent:'#FF7733'
        },
        { // 2: Forest
            bg:  ['#010A03','#021205','#010803'],
            orbs:['#00CC44','#00FF99','#006622','#88FF44','#00AA44','#00FF66'],
            accent:'#44FF99'
        },
        { // 3: Aurora (DEFAULT — matches Dika purple/pink)
            bg:  ['#050108','#08020F','#050108'],
            orbs:['#CC00FF','#FF44CC','#0088FF','#FF00BB','#7700FF','#00FFCC'],
            accent:'#CC55FF'
        },
        { // 4: Midnight
            bg:  ['#010108','#030320','#010108'],
            orbs:['#3344FF','#6677FF','#AABBFF','#2233EE','#8899FF','#99AAFF'],
            accent:'#99BBFF'
        }
    ];

    /* ── STATE ─────────────────────────────────────────────────────────── */
    let W, H;
    let bgCanvas, bgCtx;
    let mainCanvas, ctx;
    let themeIdx = 3;                         // Default: Aurora (purple)
    let t = 0, lastTime = 0;
    const rawM = { x: 0, y: 0 };
    const gyro  = { x: 0, y: 0 };
    const particles = [], ripples = [];

    // Pre-load Dika background image so canvas can draw it
    const dikaBgImg = new Image();
    dikaBgImg.src = 'https://files.catbox.moe/9h7wpt.jpg';
    let dikaBgLoaded = false;
    dikaBgImg.onload = () => { dikaBgLoaded = true; };

    // Audio
    let _audioCtx, analyser, audioArr;
    let audioOn = false, audioLevel = 0, audioTarget = 0;

    /* ── HELPERS ───────────────────────────────────────────────────────── */
    const lerp  = (a, b, t) => a + (b - a) * t;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    function hexToRgba(hex, a) {
        const r = parseInt(hex.slice(1,3),16);
        const g = parseInt(hex.slice(3,5),16);
        const b = parseInt(hex.slice(5,7),16);
        return `rgba(${r},${g},${b},${a})`;
    }

    function rrPath(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x+r, y); c.lineTo(x+w-r, y);
        c.arcTo(x+w,y, x+w,y+r, r); c.lineTo(x+w, y+h-r);
        c.arcTo(x+w,y+h, x+w-r,y+h, r); c.lineTo(x+r, y+h);
        c.arcTo(x,y+h, x,y+h-r, r); c.lineTo(x, y+r);
        c.arcTo(x,y, x+r,y, r); c.closePath();
    }

    /* ── BACKGROUND ORBS (from Canvas version) ─────────────────────────── */
    const ORB_CFG = [
        {bx:.13,by:.28,r:.60,s:.78,oi:0}, {bx:.82,by:.58,r:.65,s:.65,oi:1},
        {bx:.48,by:.82,r:.48,s:1.18,oi:2},{bx:.25,by:.68,r:.52,s:.90,oi:3},
        {bx:.72,by:.20,r:.42,s:1.08,oi:4},{bx:.58,by:.10,r:.36,s:.72,oi:5},
        {bx:.10,by:.55,r:.40,s:1.28,oi:0},{bx:.88,by:.30,r:.38,s:.82,oi:1}
    ];

    function renderBg() {
        const th = THEMES[themeIdx];
        bgCtx.clearRect(0, 0, W, H);

        /* ── 1. Dika's original dark base (#0a0a0f) ── */
        bgCtx.fillStyle = '#0a0a0f';
        bgCtx.fillRect(0, 0, W, H);

        /* ── 2. Dika's original background image (catbox.moe) ── */
        if (dikaBgLoaded) {
            bgCtx.globalAlpha = 0.55;     // slightly dimmed for orb visibility
            bgCtx.drawImage(dikaBgImg, 0, 0, W, H);
            bgCtx.globalAlpha = 1;
        }

        /* ── 3. Dika's original radial overlays (purple + pink) ── */
        const p1 = bgCtx.createRadialGradient(W*.30,H*.40,0, W*.30,H*.40, W*.45);
        p1.addColorStop(0, 'rgba(147,51,234,0.30)');
        p1.addColorStop(1, 'transparent');
        bgCtx.fillStyle = p1; bgCtx.fillRect(0,0,W,H);

        const p2 = bgCtx.createRadialGradient(W*.80,H*.70,0, W*.80,H*.70, W*.48);
        p2.addColorStop(0, 'rgba(236,72,153,0.22)');
        p2.addColorStop(1, 'transparent');
        bgCtx.fillStyle = p2; bgCtx.fillRect(0,0,W,H);

        /* ── 4. Theme gradient overlay ── */
        const bg = bgCtx.createLinearGradient(0,0,W,H);
        bg.addColorStop(0,   hexToRgba(th.bg[0].replace('#',''), 0) || 'rgba(1,8,16,0.55)');
        bg.addColorStop(1,   hexToRgba(th.bg[2].replace('#',''), 0) || 'rgba(1,10,24,0.55)');
        // Use theme colors as semi-transparent overlay
        const bgO = bgCtx.createLinearGradient(0,0,W,H);
        bgO.addColorStop(0,  th.bg[0] + 'aa');
        bgO.addColorStop(.5, th.bg[1] + '88');
        bgO.addColorStop(1,  th.bg[2] + 'aa');
        bgCtx.globalAlpha = 0.38;
        bgCtx.fillStyle = bgO; bgCtx.fillRect(0,0,W,H);
        bgCtx.globalAlpha = 1;

        /* ── 5. Animated liquid glass orbs ── */
        const audioBoost = 1 + audioLevel * .5;
        ORB_CFG.forEach((o, i) => {
            const ox  = o.bx*W + Math.sin(t*o.s + i*1.85)*W*.10;
            const oy  = o.by*H + Math.cos(t*o.s*.62 + i*2.35)*H*.09;
            const rad = o.r * Math.min(W,H) * .72 * audioBoost;
            const col = th.orbs[o.oi % th.orbs.length];
            const gr  = bgCtx.createRadialGradient(ox,oy,0,ox,oy,rad);
            gr.addColorStop(0,    hexToRgba(col, 0.38));
            gr.addColorStop(0.45, hexToRgba(col, 0.16));
            gr.addColorStop(1,    hexToRgba(col, 0));
            bgCtx.fillStyle = gr;
            bgCtx.beginPath(); bgCtx.arc(ox,oy,rad,0,Math.PI*2); bgCtx.fill();
        });
    }

    /* ── PARTICLE SYSTEM (from Canvas version) ─────────────────────────── */
    class Particle {
        constructor(x, y, col) {
            this.x=x; this.y=y;
            this.vx=(Math.random()-.5)*7;
            this.vy=(Math.random()-.5)*7-2;
            this.r=Math.random()*4+1.5;
            this.col=col;
            this.life=0; this.max=38+Math.random()*24;
            this.glow=Math.random()>.4;
            this.diamond=Math.random()<.3;
        }
        tick() {
            this.x+=this.vx; this.y+=this.vy;
            this.vy+=.20; this.vx*=.965; this.life++;
        }
        draw() {
            const a=1-this.life/this.max;
            const r=this.r*(0.5+a*.5);
            ctx.save(); ctx.globalAlpha=a;
            if(this.glow){ctx.shadowColor=this.col; ctx.shadowBlur=12;}
            ctx.fillStyle=this.col;
            if(this.diamond){
                ctx.beginPath();
                ctx.moveTo(this.x,this.y-r*1.3); ctx.lineTo(this.x+r,this.y);
                ctx.lineTo(this.x,this.y+r*1.3); ctx.lineTo(this.x-r,this.y);
                ctx.closePath(); ctx.fill();
            } else {
                ctx.beginPath(); ctx.arc(this.x,this.y,r,0,Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }
        dead(){ return this.life>=this.max; }
    }

    function spawnParticles(x, y) {
        const th=THEMES[themeIdx];
        const cols=[th.accent,'#ffffff','#e0c0ff',...th.orbs.slice(0,3)];
        for(let i=0;i<16;i++)
            particles.push(new Particle(x, y, cols[Math.floor(Math.random()*cols.length)]));
    }

    /* ── RIPPLE SYSTEM (from Canvas version) ───────────────────────────── */
    function spawnRipple(x, y) {
        ripples.push({x,y,r:6,maxR:70,alpha:0.85});
        setTimeout(()=>ripples.push({x,y,r:4,maxR:44,alpha:0.55}), 80);
    }

    function tickRipples() {
        for(let i=ripples.length-1;i>=0;i--){
            const rip=ripples[i];
            const prog=rip.r/rip.maxR;
            ctx.save();
            ctx.globalAlpha=rip.alpha*(1-prog)*.8;
            ctx.strokeStyle=THEMES[themeIdx].accent;
            ctx.lineWidth=2*(1-prog*.8);
            ctx.beginPath(); ctx.arc(rip.x,rip.y,rip.r,0,Math.PI*2); ctx.stroke();
            ctx.restore();
            rip.r+=2.8;
            if(rip.r>=rip.maxR) ripples.splice(i,1);
        }
    }

    /* ── MAIN CANVAS LOOP ──────────────────────────────────────────────── */
    function draw(ts) {
        const dt = Math.min((ts-lastTime)*.001, .05);
        lastTime = ts; t += dt;

        /* 1. Render orbs to offscreen bgCanvas */
        renderBg();

        /* 2. Draw bg to main canvas */
        ctx.clearRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(bgCanvas, 0, 0, W, H);

        /* 3. Audio update */
        if(audioOn && analyser){
            analyser.getByteFrequencyData(audioArr);
            let sum=0; audioArr.forEach(v=>sum+=v);
            audioTarget=(sum/audioArr.length)/255;
        } else { audioTarget=0; }
        audioLevel=lerp(audioLevel, audioTarget, .08);

        /* 4. Particles & ripples */
        particles.forEach(p=>{ p.tick(); p.draw(); });
        for(let i=particles.length-1;i>=0;i--) if(particles[i].dead()) particles.splice(i,1);
        tickRipples();

        requestAnimationFrame(draw);
    }

    /* ── RESIZE ────────────────────────────────────────────────────────── */
    function resize() {
        W=window.innerWidth; H=window.innerHeight;
        if(mainCanvas){ mainCanvas.width=W; mainCanvas.height=H; }
        if(bgCanvas)  { bgCanvas.width=W;   bgCanvas.height=H;   }
    }

    /* ── THEME SWITCHER (from Canvas version) ──────────────────────────── */
    function setTheme(i) {
        themeIdx=i;
        document.querySelectorAll('.tBtn').forEach((b,j)=>b.classList.toggle('active',j===i));
    }

    /* ── AUDIO (from Canvas version) ───────────────────────────────────── */
    async function initAudio() {
        const btn=document.getElementById('audioBtn');
        if(audioOn) return;
        try{
            _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
            analyser=_audioCtx.createAnalyser();
            analyser.fftSize=256; analyser.smoothingTimeConstant=.85;
            const s=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
            _audioCtx.createMediaStreamSource(s).connect(analyser);
            audioArr=new Uint8Array(analyser.frequencyBinCount);
            audioOn=true;
            btn.textContent='🎙 ON'; btn.classList.add('on');
        }catch(e){
            btn.textContent='🎙 Denied';
            console.warn('Audio:',e);
        }
    }

    /* ── INIT ──────────────────────────────────────────────────────────── */
    window.addEventListener('load', () => {
        mainCanvas=document.getElementById('mainCanvas');
        ctx=mainCanvas.getContext('2d',{alpha:true});

        bgCanvas=document.createElement('canvas');
        bgCtx=bgCanvas.getContext('2d');

        resize();
        rawM.x=W/2; rawM.y=H/2;

        window.addEventListener('resize', resize);

        window.addEventListener('mousemove', e=>{
            rawM.x=e.clientX; rawM.y=e.clientY;
        }, {passive:true});

        window.addEventListener('touchmove', e=>{
            if(e.touches.length){
                rawM.x=e.touches[0].clientX; rawM.y=e.touches[0].clientY;
            }
        }, {passive:true});

        /* Click → canvas ripple + particles (from Canvas version) */
        window.addEventListener('click', e=>{
            spawnRipple(e.clientX, e.clientY);
            spawnParticles(e.clientX, e.clientY);

            /* CSS ripple ring for social cards (extra tactile feel) */
            const el=document.createElement('div');
            el.className='cglass-ripple';
            el.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;width:30px;height:30px;`;
            document.body.appendChild(el);
            setTimeout(()=>el.remove(), 900);
        });

        /* Gyroscope (from Canvas version) */
        if(window.DeviceOrientationEvent){
            window.addEventListener('deviceorientation', e=>{
                gyro.x=clamp((e.gamma||0)/45,-1,1);
                gyro.y=clamp(((e.beta||0)-45)/45,-1,1)*.8;
            }, {passive:true});
        }

        requestAnimationFrame(draw);
    });
    </script>

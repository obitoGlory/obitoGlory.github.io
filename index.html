<!DOCTYPE html>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color:#020205; font-family:'Inter',sans-serif; color:white; overflow-x:hidden; }

        #glCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; }

        /* Glassmorphism dioptimasi */
        .glass {
            background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
        }

        .grid-card:hover {
            transform: translateY(-5px);
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .profile-img {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 3px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            object-fit: cover;
        }

        .neon-text { text-shadow: 0 0 10px rgba(168, 85, 247, 0.8); }

        /* Animasi masuk */
        .fade-in { opacity: 0; transform: translateY(15px); animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* Scrollbar Halus */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>

    <!-- ── OPTIMIZED LIGHTWEIGHT SHADER ── -->
    <script>
    (function() {
        const canvas = document.getElementById('glCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        renderer.setPixelRatio(isMobile ? 1 : window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const fragmentShader = `
            precision mediump float;
            uniform float uTime;
            uniform vec2 uRes;
            void main() {
                vec2 uv = gl_FragCoord.xy / uRes;
                float t = uTime * 0.4;
                vec3 c1 = vec3(0.06, 0.0, 0.12);
                vec3 c2 = vec3(0.01, 0.01, 0.05);
                float pulse = 0.5 + 0.5 * sin(t + distance(uv, vec2(0.5)));
                vec3 color = mix(c1, c2, uv.y + pulse * 0.2);
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
            fragmentShader
        });

        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

        function animate(t) {
            material.uniforms.uTime.value = t * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
        });
    })();

    function copyDiscord() {
        navigator.clipboard.writeText("dikaalonely").then(() => {
            const el = document.getElementById('discord-text');
            el.innerText = "Copied!";
            el.style.color = "#a855f7";
            setTimeout(() => {
                el.innerText = "@dikaalonely";
                el.style.color = "";
            }, 1000);
        });
    }
    </script>
